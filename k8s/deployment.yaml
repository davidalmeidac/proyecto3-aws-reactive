apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-reactive-api
  labels:
    app: aws-reactive-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aws-reactive-api
  template:
    metadata:
      labels:
        app: aws-reactive-api
    spec:
      containers:
      - name: aws-reactive-api
        image: aws-reactive-api:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: aws-reactive-api-service
spec:
  selector:
    app: aws-reactive-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

